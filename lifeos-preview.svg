<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12111D" />
      <stop offset="100%" stop-color="#09090E" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="240" rx="14" fill="url(#loCardBg)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Top Window Header Bar -->
  <rect width="800" height="34" rx="14" fill="#181726" />
  <rect y="20" width="800" height="14" fill="#181726" />
  <circle cx="20" cy="17" r="4" fill="#EF4444" opacity="0.8" />
  <circle cx="34" cy="17" r="4" fill="#F59E0B" opacity="0.8" />
  <circle cx="48" cy="17" r="4" fill="#10B981" opacity="0.8" />

  <rect x="70" y="8" width="190" height="18" rx="6" fill="#0E0D18" stroke="#3B0764" stroke-width="0.8" />
  <text x="82" y="20" fill="#A78BFA" font-family="system-ui, monospace" font-size="10">lifeos.perception/vision/stream</text>

  <rect x="680" y="9" width="100" height="16" rx="8" fill="#1E1B4B" stroke="#7C3AED" stroke-width="0.8" />
  <text x="690" y="20" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="600">30 FPS STREAMING</text>

  <!-- Content Grid: 2 Large Panels (Left: Live Computer Vision Viewport, Right: Telemetry & Assistance) -->

  <!-- Panel 1: Vision Camera Viewport with Bounding Boxes -->
  <g transform="translate(18, 48)">
    <rect width="450" height="174" rx="10" fill="#0A0912" stroke="#2E1065" stroke-width="1" />

    <!-- Viewport Grid Gridlines -->
    <line x1="20" y1="90" x2="430" y2="90" stroke="#1E1B4B" stroke-width="0.75" stroke-dasharray="4 4" />
    <line x1="225" y1="15" x2="225" y2="160" stroke="#1E1B4B" stroke-width="0.75" stroke-dasharray="4 4" />

    <!-- Center Reticle / Target -->
    <circle cx="225" cy="90" r="14" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Bounding Box 1: Person / Face Recognition -->
    <rect x="50" y="35" width="110" height="120" rx="4" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1.5" />
    <rect x="50" y="22" width="94" height="15" rx="3" fill="#8B5CF6" />
    <text x="54" y="33" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="600">User: Authenticated</text>

    <!-- Bounding Box 2: Laptop Object -->
    <rect x="180" y="70" width="130" height="85" rx="4" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="180" y="57" width="76" height="15" rx="3" fill="#38BDF8" />
    <text x="184" y="68" fill="#000000" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Laptop: 98%</text>

    <!-- Bounding Box 3: Note / Document OCR -->
    <rect x="330" y="80" width="90" height="70" rx="4" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.5" />
    <rect x="330" y="67" width="80" height="15" rx="3" fill="#10B981" />
    <text x="334" y="78" fill="#000000" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Text Doc: 95%</text>

    <!-- Bottom HUD Bar -->
    <rect x="10" y="150" width="430" height="18" rx="4" fill="#131220" />
    <text x="20" y="162" fill="#A1A1AA" font-family="monospace" font-size="9">YOLOv8 &bull; 3 Objects Detected &bull; Latency: 18ms &bull; Frame: 1080p</text>
  </g>

  <!-- Panel 2: Conversational Interaction & Context-Aware Assistant -->
  <g transform="translate(480, 48)">
    <rect width="302" height="174" rx="10" fill="#141322" stroke="#2E1065" stroke-width="1" />
    <text x="16" y="24" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Contextual Assistant</text>

    <!-- Assistant Chat Bubble -->
    <rect x="16" y="38" width="270" height="48" rx="8" fill="#0E0D18" stroke="#3B0764" stroke-width="0.8" />
    <text x="26" y="54" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LifeOS Assistant</text>
    <text x="26" y="70" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9">Detected laptop and technical document on desk.</text>

    <!-- User Interaction Bubble -->
    <rect x="16" y="94" width="270" height="38" rx="8" fill="#1C182E" stroke="#6D28D9" stroke-width="0.8" />
    <text x="26" y="109" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="10" font-weight="600">User Voice Query</text>
    <text x="26" y="122" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9">"Summarize the active document in front of me."</text>

    <!-- Active Assistant Status Pills -->
    <rect x="16" y="140" width="125" height="22" rx="11" fill="#1E1B4B" stroke="#7C3AED" stroke-width="0.8" />
    <text x="26" y="155" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="9">Context Aware</text>

    <rect x="148" y="140" width="138" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
    <text x="158" y="155" fill="#34D399" font-family="system-ui, sans-serif" font-size="9">Speech Understanding</text>
  </g>
</svg>
