<svg width="900" height="460" viewBox="0 0 900 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 0.95; }
      }
      @keyframes screenCode {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.9; }
      }
      @keyframes blinkLight {
        0%, 90%, 100% { opacity: 1; }
        95% { opacity: 0.2; }
      }
      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatDelayed 7s ease-in-out infinite; }
      .floating-card-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .laptop-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .screen-lines { animation: screenCode 3s ease-in-out infinite; }
      .live-dot { animation: blinkLight 3s infinite; }
    </style>

    <!-- Radial Screen & Ambient Glow -->
    <radialGradient id="deskAmbient" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4C1D95" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="screenBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181824" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#101018" stop-opacity="0.85" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="460" rx="16" fill="#080808" />
  <rect width="900" height="460" rx="16" fill="url(#deskAmbient)" />
  <rect width="900" height="460" rx="16" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1" />

  <!-- Background Workspace Shelf / Grid Elements -->
  <line x1="100" y1="360" x2="800" y2="360" stroke="#1E1B4B" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="160" y1="120" x2="160" y2="360" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="6 6" opacity="0.3" />
  <line x1="740" y1="120" x2="740" y2="360" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Desk Surface -->
  <rect x="200" y="358" width="500" height="8" rx="4" fill="#181824" stroke="#4C1D95" stroke-width="1" />
  <ellipse cx="450" cy="360" rx="220" ry="12" fill="#0D0D14" opacity="0.8" />

  <!-- Center Character (Anime-style Software Engineer at Laptop) -->
  <g id="character-group">
    <!-- Ambient Chair Backrest Silhouette -->
    <rect x="410" y="210" width="80" height="130" rx="20" fill="#12111E" stroke="#2E1065" stroke-width="1.5" />

    <!-- Torso / Dark Hoodie with Subtle Violet Tone -->
    <path d="M 390 358 L 405 270 Q 450 262 495 270 L 510 358 Z" fill="#1C182E" stroke="#3B0764" stroke-width="1.5" />
    <!-- Hoodie Collar / Shadow -->
    <path d="M 432 270 L 450 286 L 468 270 Z" fill="#0F0D1A" />
    <path d="M 425 270 Q 450 295 475 270" stroke="#7C3AED" stroke-width="1" fill="none" opacity="0.6" />

    <!-- Neck -->
    <rect x="442" y="254" width="16" height="18" fill="#D4B59E" />

    <!-- Head / Jaw Silhouette -->
    <path d="M 434 230 C 434 256 466 256 466 230 Z" fill="#E2C9B8" />

    <!-- Sleek Anime Hair (Dark Obsidian with Violet Ambient Rim Light) -->
    <path d="M 430 234 C 426 216 438 198 450 198 C 466 198 474 212 472 232 C 468 226 462 224 456 226 C 448 222 440 226 438 234 Z" fill="#1E192E" />
    <path d="M 432 216 Q 448 196 468 206" stroke="#A78BFA" stroke-width="1.5" fill="none" opacity="0.7" />
    <path d="M 440 222 L 444 234 L 448 224 L 454 235 L 458 222" fill="#1E192E" />

    <!-- Glasses / Modern Frame with Cyan-Violet Sheen -->
    <rect x="436" y="230" width="12" height="7" rx="1.5" fill="none" stroke="#A78BFA" stroke-width="1.2" />
    <rect x="452" y="230" width="12" height="7" rx="1.5" fill="none" stroke="#A78BFA" stroke-width="1.2" />
    <line x1="448" y1="233" x2="452" y2="233" stroke="#A78BFA" stroke-width="1" />

    <!-- Arms resting forward towards laptop keyboard -->
    <path d="M 405 290 Q 418 335 440 342" stroke="#1C182E" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 495 290 Q 482 335 460 342" stroke="#1C182E" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Hands typing -->
    <ellipse cx="440" cy="342" rx="6" ry="4" fill="#D4B59E" />
    <ellipse cx="460" cy="342" rx="6" ry="4" fill="#D4B59E" />
  </g>

  <!-- Laptop with Sleek Purple Ambient Glow -->
  <g id="laptop-group">
    <!-- Glow Beam Cast from Screen -->
    <polygon points="410,270 490,270 530,350 370,350" fill="url(#screenBeam)" opacity="0.6" class="laptop-glow" />

    <!-- Open Display Screen Backing -->
    <rect x="412" y="262" width="76" height="52" rx="3" fill="#141320" stroke="#7C3AED" stroke-width="1.2" />
    <!-- Active Inner Screen Area -->
    <rect x="415" y="265" width="70" height="46" rx="2" fill="#0A0814" />

    <!-- Screen UI Code & Graph Visuals -->
    <g class="screen-lines">
      <rect x="418" y="269" width="18" height="2" rx="1" fill="#8B5CF6" />
      <rect x="418" y="274" width="28" height="1.5" rx="0.75" fill="#A78BFA" />
      <rect x="418" y="278" width="22" height="1.5" rx="0.75" fill="#6D28D9" />
      <rect x="418" y="282" width="34" height="1.5" rx="0.75" fill="#A78BFA" />
      <rect x="418" y="286" width="16" height="1.5" rx="0.75" fill="#C4B5FD" />

      <!-- Mini Chart on Screen -->
      <polyline points="458,290 463,284 468,287 474,277 480,281" fill="none" stroke="#8B5CF6" stroke-width="1.2" />
      <circle cx="474" cy="277" r="1.5" fill="#C4B5FD" />
    </g>

    <!-- Laptop Base / Keyboard Deck -->
    <polygon points="398,348 502,348 514,354 386,354" fill="#181824" stroke="#4C1D95" stroke-width="1" />
    <rect x="432" y="349" width="36" height="3" rx="1" fill="#242138" />
  </g>

  <!-- Floating SaaS UI Card Left: AI System Telemetry -->
  <g class="floating-card-1" transform="translate(80, 110)">
    <rect width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <!-- Header Dot & Title -->
    <circle cx="22" cy="24" r="4" fill="#10B981" class="live-dot" />
    <text x="34" y="28" fill="#F5F5F5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">AI WORKSPACE</text>
    <rect x="156" y="18" width="42" height="16" rx="8" fill="#1E1B4B" stroke="#7C3AED" stroke-width="0.8" />
    <text x="163" y="29" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="500">ONLINE</text>

    <!-- Metrics -->
    <text x="18" y="54" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Model Intelligence</text>
    <rect x="18" y="62" width="174" height="6" rx="3" fill="#1E1B4B" />
    <rect x="18" y="62" width="145" height="6" rx="3" fill="#8B5CF6" />

    <text x="18" y="86" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Active System</text>
    <text x="18" y="98" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Autonomous Core</text>

    <text x="120" y="86" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Status</text>
    <text x="120" y="98" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Operational</text>
  </g>

  <!-- Floating SaaS UI Card Left Lower: Computer Vision Pipeline -->
  <g class="floating-card-3" transform="translate(90, 246)">
    <rect width="190" height="85" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <circle cx="22" cy="22" r="3.5" fill="#8B5CF6" />
    <text x="32" y="26" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Vision Perception</text>

    <text x="18" y="48" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Detection Engine</text>
    <text x="18" y="62" fill="#C4B5FD" font-family="monospace" font-size="11">YOLOv8 &bull; 30 FPS</text>
    <rect x="18" y="70" width="154" height="4" rx="2" fill="#1E1B4B" />
    <rect x="18" y="70" width="130" height="4" rx="2" fill="#7C3AED" />
  </g>

  <!-- Floating SaaS UI Card Right: Live Architecture Node -->
  <g class="floating-card-2" transform="translate(610, 100)">
    <rect width="210" height="120" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <!-- Header -->
    <rect x="16" y="16" width="22" height="22" rx="6" fill="#2E1065" stroke="#7C3AED" stroke-width="0.8" />
    <path d="M 23 27 L 27 31 L 31 23" stroke="#A78BFA" stroke-width="1.5" fill="none" />
    <text x="46" y="28" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Backend Services</text>
    <text x="46" y="38" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="9">Distributed Mesh</text>

    <line x1="16" y1="48" x2="194" y2="48" stroke="#1E1B4B" stroke-width="1" />

    <text x="16" y="68" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">FastAPI &bull; PostgreSQL</text>
    <text x="162" y="68" fill="#10B981" font-family="monospace" font-size="10">99.9%</text>

    <text x="16" y="86" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Redis Cache Pool</text>
    <text x="164" y="86" fill="#8B5CF6" font-family="monospace" font-size="10">&lt;15ms</text>

    <text x="16" y="104" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Vector Store (Chroma)</text>
    <text x="168" y="104" fill="#38BDF8" font-family="monospace" font-size="10">Active</text>
  </g>

  <!-- Floating SaaS UI Card Right Lower: Product Development -->
  <g class="floating-card-1" transform="translate(620, 240)">
    <rect width="190" height="90" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <circle cx="22" cy="22" r="3.5" fill="#34D399" />
    <text x="32" y="26" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Product Pipeline</text>

    <text x="18" y="48" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Krishimind-AI &bull; LifeOS</text>
    <rect x="18" y="56" width="154" height="4" rx="2" fill="#1E1B4B" />
    <rect x="18" y="56" width="138" height="4" rx="2" fill="#10B981" />

    <text x="18" y="74" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Status</text>
    <text x="60" y="74" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Shipped &bull; Tested</text>
  </g>
</svg>
