<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>

    <!-- Hexagonal Grid Pattern -->
    <pattern id="hexPattern" width="60" height="103.923" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.12" />
      <path d="M30 103.923 L60 86.603 L60 51.96 L30 69.28 L0 51.96 L0 86.603 Z" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.12" />
      <path d="M0 0 L30 17.32 L30 51.96 L0 69.28 L-30 51.96 L-30 17.32 Z" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.12" />
      <path d="M60 0 L90 17.32 L90 51.96 L60 69.28 L30 51.96 L30 17.32 Z" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="300" fill="#080808" />

  <!-- Hexagonal Pattern Layer -->
  <rect width="1200" height="300" fill="url(#hexPattern)" />

  <!-- Ambient Purple Center Glow -->
  <rect width="1200" height="300" fill="url(#purpleGlow)" />

  <!-- Subtle Top/Bottom Fade Edges -->
  <rect width="1200" height="40" fill="url(#edgeFadeTop)" />
  <linearGradient id="edgeFadeTop" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#080808" stop-opacity="0.9" />
    <stop offset="100%" stop-color="#080808" stop-opacity="0" />
  </linearGradient>

  <rect y="260" width="1200" height="40" fill="url(#edgeFadeBottom)" />
  <linearGradient id="edgeFadeBottom" x1="0" y1="260" x2="0" y2="300" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#080808" stop-opacity="0" />
    <stop offset="100%" stop-color="#080808" stop-opacity="0.9" />
  </linearGradient>
</svg>
