<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kmCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12111D" />
      <stop offset="100%" stop-color="#09090E" />
    </linearGradient>
    <linearGradient id="kmPurpleGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="240" rx="14" fill="url(#kmCardBg)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Top Window Header Bar -->
  <rect width="800" height="34" rx="14" fill="#181726" />
  <rect y="20" width="800" height="14" fill="#181726" />
  <circle cx="20" cy="17" r="4" fill="#EF4444" opacity="0.8" />
  <circle cx="34" cy="17" r="4" fill="#F59E0B" opacity="0.8" />
  <circle cx="48" cy="17" r="4" fill="#10B981" opacity="0.8" />

  <rect x="70" y="8" width="220" height="18" rx="6" fill="#0E0D18" stroke="#3B0764" stroke-width="0.8" />
  <text x="82" y="20" fill="#A78BFA" font-family="system-ui, monospace" font-size="10">krishimind.ai/dashboard/overview</text>

  <rect x="710" y="9" width="70" height="16" rx="8" fill="#1E1B4B" stroke="#7C3AED" stroke-width="0.8" />
  <text x="722" y="20" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LIVE RAG</text>

  <!-- Content Grid: 3 Panels -->

  <!-- Panel 1: Contextual Soil & Crop Analysis -->
  <g transform="translate(18, 48)">
    <rect width="240" height="174" rx="10" fill="#141322" stroke="#2E1065" stroke-width="1" />
    <text x="14" y="24" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Crop Health &amp; Soil Context</text>

    <!-- Crop Stage Progress -->
    <text x="14" y="50" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Vegetative Stage &bull; 82% Health</text>
    <rect x="14" y="58" width="212" height="6" rx="3" fill="#1E1B4B" />
    <rect x="14" y="58" width="174" height="6" rx="3" fill="url(#kmPurpleGlow)" />

    <!-- Analysis Metrics -->
    <rect x="14" y="78" width="100" height="42" rx="6" fill="#0C0B14" stroke="#2E1065" stroke-width="0.8" />
    <text x="22" y="94" fill="#71717A" font-family="system-ui, sans-serif" font-size="9">Moisture Index</text>
    <text x="22" y="110" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">68% Optimal</text>

    <rect x="126" y="78" width="100" height="42" rx="6" fill="#0C0B14" stroke="#2E1065" stroke-width="0.8" />
    <text x="134" y="94" fill="#71717A" font-family="system-ui, sans-serif" font-size="9">Nitrogen Level</text>
    <text x="134" y="110" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Stable</text>

    <!-- Image Analysis Pill -->
    <rect x="14" y="132" width="212" height="28" rx="6" fill="#1E1338" stroke="#6D28D9" stroke-width="0.8" />
    <circle cx="28" cy="146" r="4" fill="#8B5CF6" />
    <text x="38" y="150" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Leaf Pathology: Zero Necrosis Detected</text>
  </g>

  <!-- Panel 2: Weather & Market Telemetry Curve -->
  <g transform="translate(272, 48)">
    <rect width="256" height="174" rx="10" fill="#141322" stroke="#2E1065" stroke-width="1" />
    <text x="14" y="24" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Contextual Telemetry</text>

    <!-- Telemetry Graph -->
    <path d="M 20 110 Q 70 65, 120 85 T 190 60 T 240 70" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
    <path d="M 20 110 Q 70 65, 120 85 T 190 60 T 240 70 L 240 130 L 20 130 Z" fill="#8B5CF6" fill-opacity="0.08" />
    <circle cx="190" cy="60" r="4" fill="#A78BFA" />

    <text x="14" y="150" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="10">Temperature: 28°C &bull; Humidity: 54%</text>
    <text x="14" y="164" fill="#71717A" font-family="system-ui, sans-serif" font-size="9">Market Forecast: Wheat demand +14% next cycle</text>
  </g>

  <!-- Panel 3: AI Advisory Recommendations (Pinecone RAG) -->
  <g transform="translate(542, 48)">
    <rect width="240" height="174" rx="10" fill="#141322" stroke="#2E1065" stroke-width="1" />
    <text x="14" y="24" fill="#F5F5F5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI Advisory Insights</text>

    <rect x="14" y="38" width="212" height="42" rx="6" fill="#0E0D18" stroke="#3B0764" stroke-width="0.8" />
    <text x="22" y="54" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="600">&bull; Irrigation Schedule</text>
    <text x="22" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Recommended 18mm cycle in 48 hours.</text>

    <rect x="14" y="86" width="212" height="42" rx="6" fill="#0E0D18" stroke="#3B0764" stroke-width="0.8" />
    <text x="22" y="102" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="600">&bull; Nutrient Application</text>
    <text x="22" y="116" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Apply potassium supplement before rain.</text>

    <!-- Multi-Language Pill -->
    <rect x="14" y="136" width="105" height="22" rx="11" fill="#1E1B4B" stroke="#7C3AED" stroke-width="0.8" />
    <text x="24" y="151" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="9">Multi-Language</text>
    <rect x="125" y="136" width="101" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
    <text x="135" y="151" fill="#34D399" font-family="system-ui, sans-serif" font-size="9">Pinecone Vector</text>
  </g>
</svg>
